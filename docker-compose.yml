version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: digital_heroes_db
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: digital_heroes
      MYSQL_USER: dh_user
      MYSQL_PASSWORD: dh_password
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
      interval: 5s
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    container_name: digital_heroes_backend
    environment:
      - PORT=5000
      - DB_HOST=db
      - DB_USER=dh_user
      - DB_PASSWORD=dh_password
      - DB_NAME=digital_heroes
      - DB_PORT=3306
      - JWT_SECRET=change_this_in_production_32chars_min
      - JWT_EXPIRES_IN=1h
      - JWT_REFRESH_SECRET=change_this_refresh_secret_32chars_min
      - JWT_REFRESH_EXPIRES_IN=7d
      - FRONTEND_URL=http://localhost:5173
      - NODE_ENV=production
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        - VITE_API_URL=http://localhost:5000/api
    container_name: digital_heroes_frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  db_data:
